spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/arieshub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}
      connect-timeout: 2s
      timeout: 2s
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    default-statement-timeout: 5
sa-token:
  token-name: arieshub_token
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-read-header: false
  is-read-body: false
  is-read-cookie: true
  cookie:
    path: /
    http-only: true
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: Lax
app:
  email:
    provider: resend
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:}
  verification-code:
    ttl: 10m
    resend-cooldown: 60s
    max-attempts: 5
  security:
    admin-emails: ${ADMIN_EMAILS:}
